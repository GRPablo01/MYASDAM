<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA ID Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Background blur effect */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 40%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(1deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        .card-container {
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.5));
        }

        /* Main card shape with custom polygon */
        .fifa-card {
            width: 380px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            /* Custom shape: top-left normal, top-right cut, bottom-right normal, bottom-left cut */
            clip-path: polygon(
                0 0,                    /* top-left */
                85% 0,                  /* top-right before cut */
                100% 8%,                /* top-right cut point */
                100% 100%,              /* bottom-right */
                15% 100%,               /* bottom-left before cut */
                0 92%                   /* bottom-left cut point */
            );
        }

        /* Decorative side tabs */
        .side-tabs {
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }

        .side-tab {
            width: 14px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: none;
            border-radius: 0 4px 4px 0;
        }

        .side-tabs-left {
            position: absolute;
            left: -12px;
            top: 15%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }

        .side-tab-left {
            width: 14px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-right: none;
            border-radius: 4px 0 0 4px;
        }

        /* Inner glow effect */
        .fifa-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.1) 0%,
                transparent 50%,
                rgba(255, 255, 255, 0.05) 100%
            );
            pointer-events: none;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #1a1a2e;
        }

        .logo-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .title {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            line-height: 1.5;
        }

        /* Form */
        .form {
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        /* Select styling */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
            pointer-events: none;
        }

        .form-select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            appearance: none;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .form-select option {
            background: #1a1a2e;
            color: #fff;
        }

        /* Date input with icon */
        .date-wrapper {
            position: relative;
        }

        .date-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: left 0.5s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }

        /* Footer link */
        .footer {
            text-align: center;
            margin-top: 24px;
            position: relative;
            z-index: 1;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .footer-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: #fff;
        }

        /* Shine effect overlay */
        .shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                ellipse at 30% 20%,
                rgba(255, 255, 255, 0.15) 0%,
                transparent 60%
            );
            pointer-events: none;
            z-index: 0;
        }
    </style>
<base target="_blank">
</head>
<body>
    <section class="card-container">
        <!-- Left side decorative tabs -->
        <div class="side-tabs-left">
            <div class="side-tab-left"></div>
            <div class="side-tab-left"></div>
            <div class="side-tab-left"></div>
        </div>

        <!-- Main card -->
        <div class="fifa-card">
            <div class="shine"></div>

            <div class="header">
                <div class="logo">
                    <div class="logo-icon">⚽</div>
                    <span class="logo-text">FIFA ID</span>
                </div>
                <h1 class="title">Sign up</h1>
                <p class="subtitle">Join free for live matches and World Cup™ moments.</p>
            </div>

            <form class="form">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <div class="select-wrapper">
                        <select class="form-select">
                            <option value="" disabled selected>Select your gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer-not">Prefer not to say</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <div class="date-wrapper">
                        <input type="text" class="form-input" placeholder="Select your date of birth" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'">
                        <span class="date-icon">📅</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Continue</button>
            </form>

            <div class="footer">
                <p class="footer-text">Already have an account? <a href="#" class="footer-link">Sign in</a></p>
            </div>
        </div>

        <!-- Right side decorative tabs -->
        <div class="side-tabs">
            <div class="side-tab"></div>
            <div class="side-tab"></div>
            <div class="side-tab"></div>
        </div>
    </section>
</body>
</html>
