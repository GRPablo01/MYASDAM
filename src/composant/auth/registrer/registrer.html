<app-icon></app-icon>

<!-- ================================================= -->
<!-- PAGE INSCRIPTION ASDAM - UI/UX PREMIUM RESPONSIVE -->
<!-- ================================================= -->
<section
  class="relative w-full min-h-screen overflow-hidden flex items-center justify-center px-3 sm:px-4 lg:px-6 py-6"
  [ngStyle]="{
    'background': themeservice.Backgroundprincipal,
    'color': themeservice.Textprincipal
  }"
>

  <!-- BG LOGO -->
  <div class="absolute right-0 top-0 h-full w-[50vw] overflow-hidden pointer-events-none z-[1]">
    <img
      src="assets/LOGO.png"
      alt="Logo"
      class="h-full w-auto max-w-none object-cover origin-right translate-x-1/2 opacity-15"
    />
  </div>

  <!-- CARD -->
  <div
    class="relative z-10 w-full max-w-6xl rounded-[28px] overflow-hidden shadow-[0_25px_70px_-20px_rgba(0,0,0,0.55)] backdrop-blur-xl animate-fade-in-up"
    [ngStyle]="{
      'background': themeservice.Backgroundcards
    }"
  >

    <!-- TOGGLE THEME -->
    <button
      type="button"
      (click)="toggleTheme()"
      class="absolute top-4 right-4 z-50 w-10 h-10 rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all duration-300"
      [ngStyle]="{
        'background': themeservice.Backgroundcards1
      }"
    >
      <i
        class="fa-solid text-base"
        [ngClass]="themeservice.isDarkMode ? 'fa-sun' : 'fa-moon'"
        [ngStyle]="{
          'color': themeservice.Iconnormal
        }"
      ></i>
    </button>

    <div class="grid lg:grid-cols-[330px_1fr]">

      <!-- ================================= -->
      <!-- SIDEBAR DESKTOP -->
      <!-- ================================= -->
      <aside
        class="hidden lg:flex flex-col p-8 border-r"
        [ngStyle]="{
          'border-color': themeservice.primary + '20',
          'background': themeservice.Backgroundcards1
        }"
      >

        <!-- LOGO -->
        <div class="flex items-center gap-4 mb-10">

          <div
            class="w-16 h-16 rounded-full p-1"
            [ngStyle]="{
              'border': '2px solid ' + themeservice.primary
            }"
          >
            <img src="assets/LOGO.png" class="w-full h-full object-contain" />
          </div>

          <div>
            <h2 class="text-2xl font-black">ASDAM</h2>
            <p
              class="text-sm"
              [ngStyle]="{
                'color': themeservice.Textsecondaire
              }"
            >
              Inscription
            </p>
          </div>

        </div>

        <!-- ETAPES -->
        <div class="space-y-5 flex-1">

          <div
            *ngFor="let label of stepLabels; let i = index"
            class="flex items-center gap-4"
          >

            <!-- CERCLE -->
            <div
              class="w-11 h-11 rounded-full flex items-center justify-center font-bold text-sm transition-all duration-300"
              [ngStyle]="
                currentStep === i + 1
                  ? {
                      background: themeservice.primary,
                      color: '#fff'
                    }
                  : currentStep > i + 1
                  ? {
                      background: '#10B981',
                      color: '#fff'
                    }
                  : {
                      background: themeservice.Backgroundcards,
                      color: themeservice.Textsecondaire
                    }
              "
            >
              <span *ngIf="currentStep <= i + 1">{{ i + 1 }}</span>
              <i *ngIf="currentStep > i + 1" class="fa-solid fa-check"></i>
            </div>

            <!-- TEXT -->
            <div>
              <p class="font-semibold">{{ label }}</p>
              <p
                class="text-xs"
                [ngStyle]="{
                  'color': themeservice.Textsecondaire
                }"
              >
                Étape {{ i + 1 }}
              </p>
            </div>

          </div>

        </div>

        <!-- BOX INFO -->
        <div
          class="mt-8 p-5 rounded-2xl border"
          [ngStyle]="{
            'background': themeservice.Backgroundcards,
            'border-color': themeservice.primary + '20'
          }"
        >
          <p class="font-bold mb-1">
            Progression {{ currentStep }}/4
          </p>

          <div class="w-full h-2 rounded-full overflow-hidden bg-black/10 mt-3">
            <div
              class="h-full rounded-full transition-all duration-500"
              [ngStyle]="{
                'background': themeservice.primary,
                'width': (currentStep * 25) + '%'
              }"
            ></div>
          </div>

          <p
            class="text-xs mt-3"
            [ngStyle]="{
              'color': themeservice.Textsecondaire
            }"
          >
            Complétez toutes les étapes pour rejoindre le club.
          </p>
        </div>

      </aside>

      <!-- ================================= -->
      <!-- FORMULAIRE -->
      <!-- ================================= -->
      <div class="p-5 sm:p-7 lg:p-10">

        <!-- MOBILE HEADER -->
        <div class="lg:hidden text-center mb-6">
          <img src="assets/LOGO.png" class="w-16 h-16 mx-auto mb-2" />
          <h2 class="text-2xl font-black">ASDAM</h2>
          <p
            class="text-sm"
            [ngStyle]="{
              'color': themeservice.Textsecondaire
            }"
          >
            Étape {{ currentStep }}/4
          </p>
        </div>

        <!-- TITRE -->
        <div class="mb-6">
          <h1 class="text-3xl sm:text-4xl font-black mb-2">
            Créer un compte
          </h1>

          <p
            class="text-sm sm:text-base"
            [ngStyle]="{
              'color': themeservice.Textsecondaire
            }"
          >
            Rejoignez l'équipe ASDAM en quelques étapes.
          </p>
        </div>

        <!-- MESSAGE -->
        <div
          *ngIf="message"
          class="mb-5 p-4 rounded-2xl text-sm font-semibold border animate-slide-down"
          [ngStyle]="messageType === 'success'
            ? {
                background: themeservice.BgOui,
                color: themeservice.BgOuiText,
                borderColor: themeservice.BorderOui
              }
            : {
                background: themeservice.BgNon,
                color: themeservice.BgNonText,
                borderColor: themeservice.BorderNon
              }"
        >
          {{ message }}
        </div>

        <!-- FORM -->
        <form
          [formGroup]="registerForm"
          (ngSubmit)="onSubmit()"
          class="space-y-5"
        >

          <!-- STEP 1 -->
          <div *ngIf="currentStep === 1" class="space-y-4">

            <div class="grid sm:grid-cols-2 gap-4">

              <input
                type="text"
                formControlName="nom"
                placeholder="Nom"
                class="h-12 rounded-2xl px-4 border outline-none"
                [ngStyle]="{
                  'background': themeservice.Backgroundcards1,
                  'border-color': themeservice.primary
                }"
              />

              <input
                type="text"
                formControlName="prenom"
                placeholder="Prénom"
                class="h-12 rounded-2xl px-4 border outline-none"
                [ngStyle]="{
                  'background': themeservice.Backgroundcards1,
                  'border-color': themeservice.primary
                }"
              />

            </div>

            <button
              type="button"
              (click)="nextStep()"
              [disabled]="!isStep1Valid()"
              class="w-full h-12 rounded-2xl font-bold text-white hover:scale-[1.02] transition-all disabled:opacity-50"
              [ngStyle]="{
                'background': themeservice.primary
              }"
            >
              Continuer
            </button>

          </div>

          <!-- STEP 2 -->
          <div *ngIf="currentStep === 2" class="space-y-4">

            <input
              type="email"
              formControlName="email"
              placeholder="Adresse e-mail"
              class="w-full h-12 rounded-2xl px-4 border outline-none"
              [ngStyle]="{
                'background': themeservice.Backgroundcards1,
                'border-color': themeservice.primary
              }"
            />

            <div class="relative">

              <input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="Mot de passe"
                class="w-full h-12 rounded-2xl px-4 pr-12 border outline-none"
                [ngStyle]="{
                  'background': themeservice.Backgroundcards1,
                  'border-color': themeservice.primary
                }"
              />

              <button
                type="button"
                (click)="togglePassword()"
                class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-lg"
                [ngStyle]="{
                  'background': themeservice.primary,
                  'color': '#fff'
                }"
              >
                <i
                  class="fa-solid"
                  [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
                ></i>
              </button>

            </div>

            <div class="grid grid-cols-2 gap-3">

              <button
                type="button"
                (click)="prevStep()"
                class="h-12 rounded-2xl font-semibold"
                [ngStyle]="{
                  'background': themeservice.Backgroundcards1
                }"
              >
                Retour
              </button>

              <button
                type="button"
                (click)="nextStep()"
                class="h-12 rounded-2xl font-bold text-white"
                [ngStyle]="{
                  'background': themeservice.primary
                }"
              >
                Continuer
              </button>

            </div>

          </div>

          <!-- STEP 3 -->
          <div *ngIf="currentStep === 3" class="space-y-4">

            <select
              formControlName="role"
              class="w-full h-12 rounded-2xl px-4 border outline-none"
              [ngStyle]="{
                'background': themeservice.Backgroundcards1,
                'border-color': themeservice.primary
              }"
            >
              <option *ngFor="let role of roles" [value]="role">
                {{ role }}
              </option>
            </select>

            <select
              formControlName="equipe"
              class="w-full h-12 rounded-2xl px-4 border outline-none"
              [ngStyle]="{
                'background': themeservice.Backgroundcards1,
                'border-color': themeservice.primary
              }"
            >
              <option value="">Équipe</option>
              <option *ngFor="let equipe of equipes" [value]="equipe">
                {{ equipe }}
              </option>
            </select>

            <input
              type="text"
              formControlName="codeAcces"
              placeholder="Code accès"
              class="w-full h-12 rounded-2xl px-4 border outline-none"
              [ngStyle]="{
                'background': themeservice.Backgroundcards1,
                'border-color': themeservice.primary
              }"
            />

            <div class="grid grid-cols-2 gap-3">

              <button
                type="button"
                (click)="prevStep()"
                class="h-12 rounded-2xl font-semibold"
                [ngStyle]="{
                  'background': themeservice.Backgroundcards1
                }"
              >
                Retour
              </button>

              <button
                type="button"
                (click)="nextStep()"
                class="h-12 rounded-2xl font-bold text-white"
                [ngStyle]="{
                  'background': themeservice.primary
                }"
              >
                Continuer
              </button>

            </div>

          </div>

          <!-- STEP 4 -->
          <div *ngIf="currentStep === 4" class="space-y-4">

            <input
              type="text"
              formControlName="club"
              placeholder="Club"
              class="w-full h-12 rounded-2xl px-4 border outline-none"
              [ngStyle]="{
                'background': themeservice.Backgroundcards1,
                'border-color': themeservice.primary
              }"
            />

            <div class="grid grid-cols-2 gap-3">

              <button
                type="button"
                (click)="prevStep()"
                class="h-12 rounded-2xl font-semibold"
                [ngStyle]="{
                  'background': themeservice.Backgroundcards1
                }"
              >
                Retour
              </button>

              <button
                type="submit"
                class="h-12 rounded-2xl font-bold text-white"
                [ngStyle]="{
                  'background': '#10B981'
                }"
              >
                {{ isSubmitting ? 'Création...' : 'Créer mon compte' }}
              </button>

            </div>

          </div>

          <!-- LOGIN -->
          <a
            routerLink="/connexion"
            class="w-full h-12 rounded-2xl border-2 flex items-center justify-center font-semibold transition-all hover:scale-[1.02]"
            [ngStyle]="{
              'border': '2px dashed ' + themeservice.primary,
              'color': themeservice.Textprincipal
            }"
          >
            Déjà un compte
          </a>

        </form>

      </div>
    </div>
  </div>
</section>

<style>
@keyframes fade-in-up {
  from { opacity:0; transform:translateY(25px); }
  to { opacity:1; transform:translateY(0); }
}

@keyframes slide-down {
  from { opacity:0; transform:translateY(-10px); }
  to { opacity:1; transform:translateY(0); }
}

.animate-fade-in-up{
  animation:fade-in-up .6s ease forwards;
}

.animate-slide-down{
  animation:slide-down .4s ease forwards;
}

.backdrop-blur-xl{
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible{
  outline:2px solid currentColor;
  outline-offset:2px;
}
</style>
