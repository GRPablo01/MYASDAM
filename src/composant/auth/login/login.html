<app-icon></app-icon>

<!-- =============================== -->
<!-- PAGE CONNEXION ASDAM - UI/UX RESPONSIVE COMPLÈTE -->
<!-- =============================== -->
<section class="relative w-full min-h-screen overflow-hidden flex items-center justify-center"
  [ngStyle]="{'background': themeservice.Backgroundprincipal,'color':themeservice.Textprincipal}">

  <!-- IMAGE LOGO - Position fixe à droite, moitié visible, opacité faible -->
  <div class="absolute right-0 top-0 h-full w-[50vw] overflow-hidden pointer-events-none z-[2]">
    <img src="assets/LOGO.png" alt="Logo"
      class="h-full w-auto max-w-none object-cover origin-right translate-x-1/2 opacity-25" loading="eager">
  </div>

  <!-- CARD PRINCIPALE - Glassmorphism Responsive -->
  <div [ngStyle]="{'background':themeservice.Backgroundcards}"
    class="relative z-10 w-full max-w-[420px] rounded-[24px] sm:rounded-[28px] overflow-hidden shadow-[0_20px_60px_-15px_rgba(0,0,0,0.6)] animate-fade-in-up backdrop-blur-xl mx-3 sm:mx-4 my-auto">

    <button type="button" (click)="toggleTheme()"
      class="absolute top-3 right-3 sm:top-4 sm:right-4 z-30 w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all duration-300 group"
      [ngStyle]="{'background':themeservice.Backgroundcards1}"
      [attr.aria-label]="isDarkMode ? 'Passer en mode clair' : 'Passer en mode sombre'">
      <div class="relative w-full h-full flex items-center justify-center overflow-hidden rounded-full">
        <i class="fa-solid fa-sun text-lg absolute transition-all duration-500"
          [ngClass]="isDarkMode ? 'rotate-0 scale-100 opacity-100' : '-rotate-90 scale-0 opacity-0'"
          [ngStyle]="{'color': themeservice.Iconnormal}"></i>
        <i class="fa-solid fa-moon text-lg absolute transition-all duration-500"
          [ngClass]="!isDarkMode ? 'rotate-0 scale-100 opacity-100' : 'rotate-90 scale-0 opacity-0'"
          [ngStyle]="{'color': themeservice.Iconnormal}"></i>
      </div>
    </button>

    <!-- CONTENU COMPACT ET RESPONSIVE -->
    <div class="relative z-10 p-5 sm:p-6 lg:p-8">

      <!-- HEADER : LOGO + TITRE -->
      <div class="flex flex-col items-center gap-2 sm:gap-3 mb-4 sm:mb-6 animate-slide-down">

        <!-- LOGO ASDAM -->
        <div class="relative">
          <div class="absolute inset-0 rounded-full"></div>
          <div class="relative w-16 h-16 sm:w-18 sm:h-18 rounded-full overflow-hidden p-1">
            <img src="assets/LOGO.png" alt="Logo ASDAM" class="w-full h-full object-contain">
          </div>
        </div>

        <!-- TITRE -->
        <div class="text-center">
          <h1 [ngStyle]="{'color':themeservice.Textprincipal}"
            class="text-3xl sm:text-4xl font-black tracking-tight drop-shadow-lg">
            ASDAM
          </h1>
          <div class="h-1 w-12 sm:w-16 mx-auto rounded-full mt-1" [ngStyle]="{'background': themeservice.primary}">
          </div>
        </div>
      </div>

      <!-- SOUS-TITRE -->
      <div class="text-center mb-4 sm:mb-5">
        <h2 [ngStyle]="{'color':themeservice.Textprincipal}"
          class="text-lg sm:text-xl font-semibold mb-1 drop-shadow-sm">
          Connexion
        </h2>
        <p [ngStyle]="{'color':themeservice.Textsecondaire}" class="text-xs sm:text-sm leading-relaxed px-2 opacity-90">
          Accédez à votre espace personnel
        </p>
      </div>

      <!-- MESSAGE DE NOTIFICATION -->
      <div *ngIf="message"
        class="mb-4 p-3 rounded-xl text-center text-xs sm:text-sm font-medium animate-slide-down backdrop-blur-sm flex items-center justify-center gap-2 border"
        [ngStyle]="{
        'background': messageType === 'success' ? themeservice.BgOui : themeservice.BgNon,
        'color': messageType === 'success' ? themeservice.BgOuiText : themeservice.BgNonText,
        'border-color': messageType === 'success' ? themeservice.BorderOui : themeservice.BorderNon
      }">
        <i class="fa-solid" [class.fa-check-circle]="messageType === 'success'"
          [class.fa-exclamation-circle]="messageType === 'error'">
        </i>

        {{ message }}
      </div>

      <!-- FORMULAIRE COMPACT -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-3 sm:space-y-4">

        <!-- ================= 
          CHAMP EMAIL LABEL + INPUT
        ================= -->
        <div class="w-full space-y-2">

          <!-- Label -->
          <label for="email" class="block text-sm sm:text-base font-semibold ml-1 transition-all duration-300"
            [ngStyle]="{ 'color': themeservice.Textprincipal }">
            Adresse e-mail
          </label>

          <!-- Champ -->
          <div class="relative group">

            <!-- Icône -->
            <div
              class="absolute left-3 top-1/2 -translate-y-1/2 z-10 w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300 shadow-sm"
              [ngStyle]="{
                'background': themeservice.primary,
                'color': '#FFFFFF',
                'border': '1px solid ' + themeservice.primary
              }">
              <i class="fa-solid fa-envelope text-sm"></i>
            </div>

            <!-- Input -->
            <input id="email" type="email" formControlName="email" placeholder="Entrez votre e-mail"
              autocomplete="email"
              class="w-full h-12 sm:h-13 pl-13 pr-12 rounded-2xl text-sm sm:text-base font-medium transition-all duration-300 hover:shadow-md placeholder:opacity-60"
              [ngStyle]="{
                'background': themeservice.Backgroundcards1,
                'color': themeservice.Textprincipal,
                'border': '1px solid ' + themeservice.primary
              }" />

            <!-- Validation -->
            <div class="absolute right-3 top-1/2 -translate-y-1/2 transition-all duration-300" [ngClass]="loginForm.get('email')?.valid && loginForm.get('email')?.touched 
                ? 'opacity-100 scale-100 rotate-0' 
                : 'opacity-0 scale-50 rotate-90'">

              <div class="w-7 h-7 rounded-full bg-emerald-500 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-check text-white text-xs"></i>
              </div>

            </div>

          </div>

        </div>

        <!-- ================= 
          CHAMP MOT DE PASSE UI/UX AMÉLIORÉ
        ================= -->
        <div class="w-full space-y-2">

          <!-- Label -->
          <label for="password" class="block text-sm sm:text-base font-semibold ml-1 transition-all duration-300"
            [ngStyle]="{ 'color': themeservice.Textprincipal }">
            Mot de passe
          </label>

          <!-- Champ -->
          <div class="relative group">

            

            <!-- Icône gauche -->
            <div
              class="absolute left-3 top-1/2 -translate-y-1/2 z-10 w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300 shadow-sm"
              [ngStyle]="{
                'background': themeservice.primary,
                'color': '#FFFFFF',
                'border': '1px solid ' + themeservice.primary
              }">
              <i class="fa-solid fa-lock text-sm"></i>
            </div>

            <!-- Input -->
            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
              placeholder="Entrez votre mot de passe" autocomplete="current-password"
              class="w-full h-12 sm:h-13 pl-13 pr-14 rounded-2xl text-sm sm:text-base font-medium transition-all duration-300 hover:shadow-md placeholder:opacity-60"
              [ngStyle]="{
        'background': themeservice.Backgroundcards1,
        'color': themeservice.Textprincipal,
        'border': '1px solid ' + themeservice.primary
      }" />

            <!-- Bouton afficher / masquer -->
            <button type="button" (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95 shadow-sm"
              [ngStyle]="{
        'background': themeservice.primary,
        'color': '#FFFFFF',
        'border': '1px solid ' + themeservice.primary
      }">

              <i class="fa-solid text-sm transition-all duration-300" [class.fa-eye]="!showPassword"
                [class.fa-eye-slash]="showPassword">
              </i>

            </button>

          </div>

        </div>

        <!-- BOUTON CONNEXION -->
        <button type="submit" [disabled]="loginForm.invalid || isLoading"
          class="relative w-full h-11 sm:h-12 rounded-xl font-semibold text-sm sm:text-base tracking-wide shadow-lg hover:shadow-xl transform hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none overflow-hidden group mt-2"
          (mouseenter)="isHovered = true" (mouseleave)="isHovered = false" [ngStyle]="{
            'background': themeservice.primary,
            'color': '#FFFFFF'
          }">

          <!-- Effet de vague -->
          <span
            class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></span>

          <!-- Contenu -->
          <span class="relative z-10 flex items-center justify-center gap-2">
            <span *ngIf="!isLoading">Se connecter</span>
            <i *ngIf="isLoading" class="fa-solid fa-circle-notch fa-spin"></i>
            <i *ngIf="!isLoading"
              class="fa-solid fa-arrow-right transition-transform duration-300 group-hover:translate-x-1"></i>
          </span>
        </button>

        <!-- SÉPARATEUR -->
        <div class="relative my-3 sm:my-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-opacity-20" [ngStyle]="{'border-color': isDarkMode ? 'white' : 'black'}">
            </div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-2 backdrop-blur-xl" [ngStyle]="{
              'background': themeservice.Backgroundcards,
              'color': themeservice.Textsecondaire
            }">ou</span>
          </div>
        </div>

        <!-- LIEN INSCRIPTION - Style bouton secondaire -->
        <a routerLink="/inscription"
          class="flex items-center justify-center gap-2 w-full  py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 hover:scale-[1.02] active:scale-95 border-2"
          [ngStyle]="{
            'border':'3px dashed'+ themeservice.primary,
            'color': themeservice.Textprincipal
            
          }">
          <span>Créer un compte</span>
          <i class="fa-solid fa-user-plus"></i>
        </a>

        <!-- Footer sécurité -->
        <div class="text-center mt-4 pt-3 border-t border-opacity-10"
          [ngStyle]="{'border-color': isDarkMode ? 'white' : 'black'}">
          <div class="flex items-center justify-center gap-1.5 mb-1">
            <i class="fa-solid fa-shield-halved text-[10px]" [ngStyle]="{'color': themeservice.Textsecondaire}"></i>
            <span class="text-[10px] sm:text-xs" [ngStyle]="{'color': themeservice.Textsecondaire}">Connexion sécurisée
              SSL</span>
          </div>
          <p class="text-[10px]" [ngStyle]="{'color': themeservice.Textsecondaire}">
            © 2026 ASDAM. Tous droits réservés.
          </p>
        </div>

      </form>

    </div>
  </div>

</section>

<!-- STYLES CSS PERSONNALISÉS -->
<style>
  /* Animations */
  @keyframes fade-in-up {
    from {
      opacity: 0;
      transform: translateY(20px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes slide-down {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes subtle-zoom {

    0%,
    100% {
      transform: scale(1.05);
    }

    50% {
      transform: scale(1.1);
    }
  }

  @keyframes float-slow {

    0%,
    100% {
      transform: translateY(0) translateX(0);
      opacity: 0.2;
    }

    50% {
      transform: translateY(-15px) translateX(8px);
      opacity: 0.4;
    }
  }

  @keyframes float-medium {

    0%,
    100% {
      transform: translateY(0) translateX(0);
      opacity: 0.1;
    }

    50% {
      transform: translateY(-20px) translateX(-10px);
      opacity: 0.25;
    }
  }

  @keyframes float-fast {

    0%,
    100% {
      transform: translateY(0) translateX(0);
      opacity: 0.2;
    }

    50% {
      transform: translateY(-10px) translateX(5px);
      opacity: 0.5;
    }
  }

  @keyframes pulse-slow {

    0%,
    100% {
      opacity: 0.3;
      transform: scale(1);
    }

    50% {
      opacity: 0.5;
      transform: scale(1.05);
    }
  }

  /* Classes utilitaires */
  .animate-fade-in-up {
    animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .animate-slide-down {
    animation: slide-down 0.4s ease-out forwards;
  }

  .animate-subtle-zoom {
    animation: subtle-zoom 25s ease-in-out infinite;
  }

  .animate-float-slow {
    animation: float-slow 10s ease-in-out infinite;
  }

  .animate-float-medium {
    animation: float-medium 7s ease-in-out infinite;
  }

  .animate-float-fast {
    animation: float-fast 5s ease-in-out infinite;
  }

  .animate-pulse-slow {
    animation: pulse-slow 4s ease-in-out infinite;
  }

  /* Glassmorphism */
  .backdrop-blur-xl {
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  /* Focus visible pour accessibilité */
  button:focus-visible,
  a:focus-visible,
  input:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }

  /* Animation de secousse pour erreurs */
  @keyframes shake {

    0%,
    100% {
      transform: translateX(0);
    }

    10%,
    30%,
    50%,
    70%,
    90% {
      transform: translateX(-3px);
    }

    20%,
    40%,
    60%,
    80% {
      transform: translateX(3px);
    }
  }

  .shake {
    animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
  }

  /* Très petits écrans */
  @media (max-width: 360px) {
    .max-w-\[420px\] {
      max-width: 100%;
    }

    .p-5 {
      padding: 1rem;
    }

    .text-3xl {
      font-size: 1.75rem;
    }
  }

  /* Hauteur d'écran réduite */
  @media (max-height: 700px) and (orientation: landscape) {
    section {
      min-height: auto;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }
  }

  /* Réduction des animations si demandé */
  @media (prefers-reduced-motion: reduce) {

    .animate-fade-in-up,
    .animate-slide-down,
    .animate-subtle-zoom,
    .animate-float-slow,
    .animate-float-medium,
    .animate-float-fast,
    .animate-pulse-slow {
      animation: none;
    }
  }
</style>
