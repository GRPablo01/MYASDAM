<section 
  [ngStyle]="{
    'background': themeService.Backgroundcards, 
    'color': themeService.Textprincipal
  }" 
  class="relative h-328 sm:h-228 pt-15 flex flex-col overflow-hidden"
>

    <!-- BACKGROUND ANIMÉ (INTÉGRÉ AU SCROLL) -->
    <div class="absolute inset-0 z-10">
        <div 
          class="w-full h-full opacity-[0.08]"
          [ngStyle]="{
            'background-image': 
              'linear-gradient(' + themeService.Textsecondaire + ' 1px, transparent 1px), linear-gradient(90deg, ' + themeService.Textsecondaire + ' 1px, transparent 1px)',
            'background-size': '50px 50px'
          }">
        </div>
    </div>

    <!-- ================= NAVIGATION ================= -->
    <nav 
      class="w-full flex justify-center py-5 backdrop-blur-md transition-all duration-300 z-10"
      [ngStyle]="{ 'border-bottom': themeService.Bordernormal }"
    >

        <div class="flex flex-wrap justify-center gap-3 md:gap-4 max-w-[1200px] w-full px-4">

            <button 
              *ngFor="let item of currentNavItems"
              (click)="setView(item.id)"
              (mouseenter)="hoveredItem = item.id"
              (mouseleave)="hoveredItem = null"
              class="relative px-5 py-2.5 rounded-2xl flex items-center gap-2 text-sm font-semibold transition-all duration-300"
              [ngStyle]="{
                'background': isActive(item.id)
                  ? themeService.primary
                  : (hoveredItem === item.id 
                      ? themeService.primarySoft 
                      : themeService.Backgroundcards),

                'color': isActive(item.id)
                  ? '#FFFFFF'
                  : (hoveredItem === item.id 
                      ? themeService.primary 
                      : themeService.Textprincipal),

                'border': hoveredItem === item.id || isActive(item.id)
                  ? themeService.Borderfocus
                  : themeService.Bordernormal,

                'box-shadow': hoveredItem === item.id
                  ? '0 6px 20px rgba(0,0,0,0.15)'
                  : 'none',

                'transform': hoveredItem === item.id 
                  ? 'translateY(-2px)' 
                  : 'translateY(0)'
              }"
            >

                <i 
                  [class]="item.icon"
                  class="transition-all duration-300"
                  [ngStyle]="{
                    'color': isActive(item.id)
                      ? '#FFFFFF'
                      : (hoveredItem === item.id 
                          ? themeService.Iconhover 
                          : themeService.Iconnormal)
                  }"
                ></i>

                <span>{{ item.label }}</span>

            </button>

        </div>
    </nav>

    <!-- ================= CONTENU ================= -->
    <div class="flex-1 w-full max-w-7xl mx-auto px-4 py-6 z-10">

        <div *ngIf="currentView === 'Centre de Commande'">
            <app-commande></app-commande>
        </div>

        <div *ngIf="currentView === 'planning'">
            <app-section-date2></app-section-date2>
        </div>

        <div *ngIf="currentView === 'match'">
            <h2 class="text-3xl font-bold mb-6">Matchs</h2>
        </div>

        <div *ngIf="currentView === 'equipe'">
            <h2 class="text-3xl font-bold mb-6">Équipe</h2>
        </div>

        <div *ngIf="currentView === 'convocations'">
            <h2 class="text-3xl font-bold mb-6">Convocation</h2>
        </div>

        <div *ngIf="currentView === 'profil'">
            <app-info></app-info>
        </div>

    </div>

</section>
