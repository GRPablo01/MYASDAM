<app-icon></app-icon>

<footer class="h-auto py-10 px-12.5">

  <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start md:items-start">
    
    <!-- ================= TEXTE (Gauche) ================= -->
    <div class="md:col-span-4 flex flex-col items-center md:items-start text-center md:text-left">
      <!-- Logo -->
      <div class="flex flex-col sm:flex-row items-center gap-4 group cursor-pointer mb-4" 
           (mouseenter)="logoHover = true" (mouseleave)="logoHover = false">

        <div class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-xl transition-all duration-500 relative overflow-hidden"
          [ngStyle]="{
                 'background': themeService.primary,
                 'transform': logoHover ? 'rotate(6deg) scale(1.05)' : 'none'
               }">

          <img src="{{ themeService.ThemeImage }}" class="w-12 h-12 object-contain relative z-10" alt="Logo MYASDAM" />
        </div>

        <div>
          <h2 class="text-2xl sm:text-3xl font-black tracking-tight" [ngStyle]="{ 'color': themeService.primary }">
            ASDAM
          </h2>
          <p class="text-xs uppercase tracking-widest opacity-60" [ngStyle]="{ 'color': themeService.Textsecondaire }">
            Plateforme officielle
          </p>
        </div>
      </div>

      <!-- Description -->
      <p [style.background]="themeService.Backgroundcards"
   [ngStyle]="{ 'color': themeService.Textsecondaire }"
   class="text-sm sm:text-base md:text-lg leading-relaxed max-w-md
       p-4 rounded-xl shadow-inner mb-4
       transition-all duration-300 text-center md:text-left">
        Rejoignez notre communauté pour <span class="font-semibold">suivre vos activités</span>,
        <span class="font-semibold">consulter vos convocations</span> et rester informé des nouveautés.
      </p>

      <!-- Social -->
      <div class="flex gap-4 pt-2 flex-wrap justify-center md:justify-start">
        <a *ngFor="let social of socials" [href]="social.link" target="_blank" rel="noopener noreferrer"
          class="w-11 h-11 rounded-xl flex items-center justify-center transition-all duration-300 hover:scale-110 hover:-translate-y-1"
          [ngStyle]="{ 
            'background': themeService.secondary,
            'border': '2px solid red' 
          }">
          <i [class]="social.icon" [ngStyle]="{ 'color': themeService.primary }" class="text-lg"></i>
        </a>
      </div>
    </div>

    <!-- ================= LIENS (Centre) ================= -->
    <div class="md:col-span-4 flex flex-col items-center">

      <h4 class="font-bold mb-6 text-lg" [ngStyle]="{ 'color': themeService.Textprincipal }">
        Liens utiles
      </h4>

      <ul class="space-y-3 text-center">
        <li *ngFor="let link of filteredLinks">
          <a [href]="link.url"
            class="group flex items-center justify-center gap-3 transition-all duration-300 hover:translate-x-2"
            [ngStyle]="{ 'color': themeService.Textsecondaire }">

            <div class="w-2 h-2 rounded-full" [ngStyle]="{ 'background': themeService.primary }"></div>

            <span class="relative">
              {{ link.label }}
              <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-current transition-all duration-300 group-hover:w-full"></span>
            </span>
          </a>
        </li>
      </ul>
    </div>

    <!-- ================= CONTACT (Droite) ================= -->
    <div class="md:col-span-4 flex flex-col items-center md:items-end text-center md:text-right">

      <h4 class="font-bold text-lg mb-6" [ngStyle]="{ 'color': themeService.Textprincipal}">
        Contact
      </h4>

      <!-- Email -->
      <a href="mailto:contact@monsite.com"
        class="flex flex-col sm:flex-row items-center gap-4 p-4 rounded-2xl transition-all duration-300 hover:scale-[1.02] w-full max-w-md justify-center sm:justify-end"
        [ngStyle]="{
          'color': themeService.Textprincipal,
          'background': themeService.Backgroundcards,
          'border': themeService.Bordernormal
        }">

        <div class="text-center sm:text-right order-2 sm:order-1">
          <p class="text-xs opacity-60 uppercase">Email</p>
          <p class="font-bold text-sm sm:text-base">contact@monsite.com</p>
        </div>

        <div class="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg order-1 sm:order-2"
          [ngStyle]="{ 'background': themeService.primary }">
          <i class="fa-solid fa-envelope text-white text-lg"></i>
        </div>
      </a>

      <!-- Téléphone -->
      <a href="tel:+33000000000"
        class="flex flex-col sm:flex-row items-center gap-4 p-4 rounded-2xl transition-all duration-300 hover:scale-[1.02] w-full max-w-md justify-center sm:justify-end mt-4"
        [ngStyle]="{
          'color': themeService.Textprincipal,
          'background': themeService.Backgroundcards,
          'border': themeService.Bordernormal
        }">

        <div class="text-center sm:text-right order-2 sm:order-1">
          <p class="text-xs opacity-60 uppercase">Téléphone</p>
          <p class="font-bold text-sm sm:text-base">+33 0 00 00 00 00</p>
        </div>

        <div class="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg order-1 sm:order-2"
          [ngStyle]="{ 'background': themeService.primary }">
          <i class="fa-solid fa-phone text-white text-lg"></i>
        </div>
      </a>
    </div>
  </div>
</footer>
