<!-- ========================================== -->
<!-- USER FOOTBALL COMPONENT -->
<!-- MENU ROLE DYNAMIQUE RESPONSIVE -->
<!-- ========================================== -->

<section class="relative inline-block font-sans select-none" [ngStyle]="{'color': themeService.Textprincipal}">

  <!-- ======================= -->
  <!-- BOUTON USER -->
  <!-- ======================= -->
  <button
    id="userMenuButton"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    class="group relative flex items-center gap-2 pl-1.5 pr-3 py-1.5 rounded-full border shadow-md transition-all duration-300 hover:shadow-lg hover:scale-[1.02] active:scale-95 focus:outline-none"
    [ngStyle]="{'background': themeService.Backgroundprincipal, 'border': themeService.Bordernormal}"
  >

    <!-- AVATAR -->
    <div class="relative">
      <div
        class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white text-xs shadow-sm"
        [ngStyle]="{'background': themeService.Fondboutonprincipal}"
      >
        {{ initials || 'IN' }}
      </div>
      <span
        class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2"
        [ngStyle]="{'background': StatutColor, 'border-color': themeService.Backgroundcards}"
      ></span>
    </div>

    <!-- INFOS USER (toujours visibles sur mobile et desktop) -->
    <div class="flex flex-col text-left min-w-[80px]">
      <span class="text-xs font-bold truncate">{{ prenom }} {{ nom }}</span>
      <span class="text-[10px] opacity-70" [ngStyle]="{'color': themeService.Textsecondaire}">
        {{ formatRole(role) }}
      </span>
    </div>

    <!-- CHEVRON -->
    <svg
      class="w-3.5 h-3.5 transition-transform duration-300 ml-1"
      [class.rotate-180]="menuOpen"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>

  <!-- ======================= -->
  <!-- MENU -->
  <!-- ======================= -->
  <div
    *ngIf="menuOpen"
    id="userMenuDropdown"
    class="absolute right-0 top-full mt-2 w-full sm:w-64 rounded-xl border shadow-2xl overflow-hidden z-50 animate-dropdown"
    [ngStyle]="{'background': themeService.Backgroundcards, 'border': themeService.Bordernormal}"
  >

    <!-- HEADER USER -->
    <div
      class="px-4 py-3 border-b flex items-center gap-3"
      [ngStyle]="{'background': themeService.primarySoft, 'border-color': themeService.Bordernormal}"
    >
      <div
        class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white text-sm shadow"
        [ngStyle]="{'background': themeService.Fondboutonprincipal}"
      >
        {{ initials || 'IN' }}
      </div>
      <div class="flex-1">
        <p class="text-sm font-bold">{{ prenom || 'Pablo' }} {{ nom || 'Garcia'}}</p>
        <p class="text-[11px] opacity-70" [ngStyle]="{'color': themeService.Textsecondaire}">{{ email }}</p>
      </div>
    </div>

    <!-- NAVIGATION ROLE -->
    <nav class="py-2 flex flex-col">
      <!-- ADMIN -->
      <ng-container *ngIf="role === 'admin'">
        <a routerLink="/dashboard" class="menu-item"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
        <a routerLink="/users" class="menu-item"><i class="fa-solid fa-users"></i><span>Utilisateurs</span></a>
        <a routerLink="/teams" class="menu-item"><i class="fa-solid fa-people-group"></i><span>Équipes</span></a>
        <a routerLink="/matchs" class="menu-item"><i class="fa-solid fa-futbol"></i><span>Matchs</span></a>
      </ng-container>

      <!-- ENTRAINEUR -->
      <ng-container *ngIf="role === 'entraineur'">
        <a routerLink="/dashboard" class="menu-item"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
        <a routerLink="/team" class="menu-item"><i class="fa-solid fa-people-group"></i><span>Mon équipe</span></a>
        <a routerLink="/convocations" class="menu-item"><i class="fa-solid fa-list-check"></i><span>Convocations</span></a>
        <a routerLink="/matchs" class="menu-item"><i class="fa-solid fa-futbol"></i><span>Matchs</span></a>
      </ng-container>

      <!-- JOUEUR -->
      <ng-container *ngIf="role === 'joueur'">
        <a routerLink="/dashboard" class="menu-item"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
        <a routerLink="/matchs" class="menu-item"><i class="fa-solid fa-futbol"></i><span>Mes matchs</span></a>
        <a routerLink="/stats" class="menu-item"><i class="fa-solid fa-chart-simple"></i><span>Mes stats</span></a>
      </ng-container>

      <!-- SUPPORTER / INVITÉ -->
      <ng-container *ngIf="role === 'inviter' || !role">
        <a routerLink="/dashboard" class="menu-item"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></a>
        <a routerLink="/dashboard" class="menu-item"><i class="fa-solid fa-chart-line"></i><span>Accueil</span></a>
        <a routerLink="/matchs" class="menu-item"><i class="fa-solid fa-futbol"></i><span>Matchs</span></a>
      </ng-container>

      <div class="separator"></div>

      <button (click)="deconnecter()" class="menu-item logout w-full text-left">
        <i class="fa-solid fa-right-from-bracket"></i><span>Déconnexion</span>
      </button>
    </nav>
  </div>

  <!-- OVERLAY MOBILE -->
  <div *ngIf="menuOpen" (click)="closeMenu()" class="fixed inset-0 z-40 bg-black/20"></div>

</section>

<!-- ======================= -->
<!-- STYLE CSS -->
<!-- ======================= -->
<style>
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    margin: 4px 8px;
    border-radius: 10px;
    font-size: 13px;
    transition: all .2s;
    cursor: pointer;
  }

  .menu-item i {
    width: 16px;
    text-align: center;
    opacity: .8;
  }

  .menu-item:hover {
    background: rgba(0,0,0,.05);
    transform: translateX(3px);
  }

  .logout {
    color: #ef4444;
  }

  .logout:hover {
    background: rgba(239,68,68,.1);
  }

  .separator {
    height: 1px;
    margin: 8px 16px;
    opacity: .15;
    background: currentColor;
  }

  @keyframes dropdown {
    from { opacity: 0; transform: translateY(-8px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .animate-dropdown {
    animation: dropdown .18s ease;
  }
</style>
