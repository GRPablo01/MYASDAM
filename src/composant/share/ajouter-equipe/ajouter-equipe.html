<section class="p-3 sm:p-6 md:p-8 transition-colors duration-500">

  <div class="mx-auto w-full max-w-7xl flex justify-center">

    <div (click)="toggleForm()" class="w-full max-w-sm sm:max-w-md md:max-w-lg px-2">

      <div
        class="group relative overflow-hidden cursor-pointer rounded-2xl sm:rounded-3xl w-full 
               p-4 sm:p-6 md:p-8 
               transition-all duration-500 
               active:scale-[0.98] hover:scale-[1.02] border"
        [ngStyle]="{ 
          'background-color': themeService.Backgroundcards,
          'border-color': themeService.primary + '25',
          'box-shadow': '0 20px 60px -15px ' + themeService.primary + '15'
        }">

        <!-- Effet lumière -->
        <div
          class="absolute inset-0 opacity-0 group-hover:opacity-100 
                 bg-gradient-to-r from-transparent via-white/10 to-transparent 
                 -translate-x-full group-hover:translate-x-full 
                 transition-all duration-1000">
        </div>

        <!-- Glow -->
        <div
          class="absolute -top-16 -right-16 w-32 h-32 sm:w-40 sm:h-40 
                 rounded-full opacity-20 blur-3xl group-hover:opacity-40"
          [ngStyle]="{ 'background-color': themeService.primary }">
        </div>

        <!-- CONTENU -->
        <div class="relative z-10 flex flex-col items-center text-center gap-3 sm:gap-4 md:gap-5">

          <!-- ICON -->
          <div
            class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 
                   rounded-xl sm:rounded-2xl flex items-center justify-center 
                   transition-all duration-500 
                   group-hover:scale-110 group-hover:rotate-3"
            [ngStyle]="{ 
              'background': 'linear-gradient(145deg, ' + themeService.primary + ', ' + themeService.primaryHover + ')'
            }">
            <i class="fa-solid fa-plus text-white text-lg sm:text-xl md:text-2xl"></i>
          </div>

          <!-- EQUIPE -->
<div class="flex flex-col gap-1 sm:gap-2">
  <h3 class="font-bold tracking-tight leading-tight
             text-base sm:text-lg md:text-xl lg:text-2xl"
      [ngStyle]="{ 'color': themeService.Textprincipal }">
    Ajouter Équipe
  </h3>

  <p class="font-medium leading-relaxed mx-auto
           text-xs sm:text-sm md:text-base
           max-w-[180px] sm:max-w-[220px] md:max-w-xs"
     [ngStyle]="{ 'color': themeService.Textsecondaire }">
    Ajouter nouvelle équipe club
  </p>
</div>

          <!-- ACTION -->
          <div class="flex items-center gap-2 mt-1 opacity-70 group-hover:opacity-100 transition">

            <span 
              class="uppercase tracking-wider font-semibold
                     text-[10px] sm:text-xs md:text-sm"
              [ngStyle]="{ 'color': themeService.primary }">
              Appuyer
            </span>

            <i class="fa-solid fa-arrow-right 
                      text-[10px] sm:text-xs md:text-sm 
                      group-hover:translate-x-1 transition"
              [ngStyle]="{ 'color': themeService.primary }"></i>
          </div>

        </div>

        <!-- Glow bas -->
        <div class="absolute -bottom-6 -left-6 w-24 h-24 rounded-full opacity-10 blur-2xl"
             [ngStyle]="{ 'background-color': themeService.primary }">
        </div>

        <!-- Ligne top -->
        <div
          class="absolute top-0 left-0 right-0 h-[2px] opacity-50 group-hover:opacity-100"
          [ngStyle]="{ 
            'background': 'linear-gradient(90deg, transparent, ' + themeService.primary + ', transparent)'
          }">
        </div>

      </div>
    </div>

  </div>

</section>

<!-- ============================================
         MODAL - DESIGN THÉMATIQUE AVANCÉ
         ============================================= -->

<div *ngIf="showForm"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 transition-all duration-300 ease-out" [ngStyle]="{ 
        'background-color': themeService.Backgroundprincipal + 'CC',
        'backdrop-filter': 'blur(12px)'
      }" (click)="toggleForm()">

  <div
    class="relative w-full max-h-[90vh] overflow-hidden rounded-3xl transform transition-all duration-300 scale-95 opacity-0 animate-modal-in border"
    [ngStyle]="{ 
          'background-color': themeService.Backgroundcards,
          'border-color': themeService.primary + '20',
          'box-shadow': '0 25px 50px -12px ' + themeService.Backgroundprincipal + '80'
        }" [class.scale-100]="showForm" [class.opacity-100]="showForm" [class.max-w-sm]="true"
    [class.min-[473px]:max-w-2xl]="true" [class.min-[781px]:max-w-4xl]="true" (click)="$event.stopPropagation()">

    <!-- HEADER -->
    <div class="relative px-6 py-6 min-[382px]:px-5 min-[781px]:px-8 min-[781px]:py-7 overflow-hidden"
      [ngStyle]="{ 'background': 'linear-gradient(135deg, ' + themeService.primary + ' 0%, ' + themeService.primaryHover + ' 100%)' }">

      <!-- Éléments décoratifs animés -->
      <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-white rounded-full blur-3xl opacity-20 animate-pulse"></div>
        <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-white rounded-full blur-3xl opacity-10"></div>
      </div>

      <div class="relative flex items-center justify-between gap-4">
        <div class="flex items-center gap-4 min-[382px]:gap-3">
          <div
            class="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg min-[382px]:w-10 min-[382px]:h-10 bg-white/20 backdrop-blur-sm border border-white/30">
            <i class="fa-solid fa-users text-white text-xl min-[382px]:text-lg"></i>
          </div>
          <div>
            <h2 class="font-bold text-white text-lg min-[382px]:text-base tracking-tight">Nouvelle Équipe</h2>
            <p class="text-white/90 text-sm min-[382px]:text-xs font-medium">Remplissez les informations ci-dessous</p>
          </div>
        </div>

        <button (click)="toggleForm()"
          class="w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200 hover:bg-white/20 hover:rotate-90 active:scale-90 min-[382px]:w-8 min-[382px]:h-8 group"
          aria-label="Fermer">
          <i class="fa-solid fa-xmark text-white text-xl group-hover:text-white/90"></i>
        </button>
      </div>
    </div>

    <!-- FORM -->
    <form [formGroup]="equipeForm" (ngSubmit)="ajouterEquipe()"
      class="p-6 overflow-y-auto max-h-[65vh] min-[382px]:p-5 min-[473px]:max-h-[70vh] min-[781px]:p-8 min-[781px]:grid min-[781px]:grid-cols-2 min-[781px]:gap-8"
      [ngStyle]="{ 'background-color': themeService.Backgroundcards }">

      <!-- GAUCHE -->
      <div class="space-y-6 min-[781px]:space-y-6">

        <div class="space-y-2 group">
          <label
            class="text-xs font-bold uppercase tracking-wider ml-1 transition-colors duration-200 flex items-center gap-2"
            [ngStyle]="{ 'color': themeService.Textsecondaire }">
            <i class="fa-solid fa-tag opacity-70" [ngStyle]="{ 'color': themeService.primary }"></i>
            Nom de l'équipe
          </label>
          <div class="relative">
            <input type="text" formControlName="nom" placeholder="Ex: Les Dragons"
              class="w-full p-4 rounded-xl transition-all duration-300 outline-none focus:ring-2" [ngStyle]="{ 
                    'background-color': themeService.secondary,
                    'color': themeService.Textprincipal,
                    'border': '1px solid ' + themeService.Textsecondaire + '20',
                    'box-shadow': 'inset 0 2px 4px ' + themeService.Backgroundprincipal + '20'
                  }" [style.--tw-ring-color]="themeService.primary + '40'">
            <div
              class="absolute right-4 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
              <i class="fa-solid fa-pen text-sm" [ngStyle]="{ 'color': themeService.Textsecondaire }"></i>
            </div>
          </div>
        </div>

        <div class="space-y-2 group">
          <label
            class="text-xs font-bold uppercase tracking-wider ml-1 transition-colors duration-200 flex items-center gap-2"
            [ngStyle]="{ 'color': themeService.Textsecondaire }">
            <i class="fa-solid fa-calendar opacity-70" [ngStyle]="{ 'color': themeService.primary }"></i>
            Saison
          </label>
          <div class="relative">
            <input type="text" formControlName="saison" placeholder="Ex: 2025-2026"
              class="w-full p-4 rounded-xl transition-all duration-300 outline-none focus:ring-2" [ngStyle]="{ 
                    'background-color': themeService.secondary,
                    'color': themeService.Textprincipal,
                    'border': '1px solid ' + themeService.Textsecondaire + '20',
                    'box-shadow': 'inset 0 2px 4px ' + themeService.Backgroundprincipal + '20'
                  }" [style.--tw-ring-color]="themeService.primary + '40'">
            <div
              class="absolute right-4 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
              <i class="fa-solid fa-pen text-sm" [ngStyle]="{ 'color': themeService.Textsecondaire }"></i>
            </div>
          </div>
        </div>

      </div>

      <!-- DROITE - UPLOAD -->
      <div class="space-y-6 mt-6 min-[781px]:mt-0">

        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider ml-1 flex items-center gap-2"
            [ngStyle]="{ 'color': themeService.Textsecondaire }">
            <i class="fa-solid fa-image opacity-70" [ngStyle]="{ 'color': themeService.primary }"></i>
            Logo de l'équipe
          </label>

          <div class="relative group cursor-pointer transition-all duration-300"
            (dragover)="$event.preventDefault(); isDragging = true" (dragleave)="isDragging = false"
            (drop)="onFileDrop($event)" [ngStyle]="{ 'transform': isDragging ? 'scale(1.02)' : 'scale(1)' }">

            <input type="file" (change)="onFileChange($event)" accept="image/*"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" #fileInput>

            <div
              class="w-full p-6 rounded-xl border-2 border-dashed transition-all duration-300 flex flex-col items-center justify-center gap-3 min-h-[150px] group-hover:border-solid"
              [ngStyle]="{ 
                    'background-color': themeService.secondary + '80',
                    'border-color': isDragging ? themeService.primary : themeService.Textsecondaire + '30'
                  }">

              <div
                class="w-12 h-12 rounded-full flex items-center justify-center transition-all duration-300 group-hover:scale-110"
                [ngStyle]="{ 'background-color': themeService.primarySoft }">
                <i class="fa-solid fa-cloud-arrow-up text-2xl" [ngStyle]="{ 'color': themeService.primary }"></i>
              </div>

              <div class="text-center">
                <p class="text-sm font-medium mb-1" [ngStyle]="{ 'color': themeService.Textprincipal }">
                  <span class="font-semibold" [ngStyle]="{ 'color': themeService.primary }">Cliquez pour upload</span>
                  <span [ngStyle]="{ 'color': themeService.Textsecondaire }">ou glissez-déposez</span>
                </p>
                <p class="text-xs" [ngStyle]="{ 'color': themeService.Textsecondaire }">PNG, JPG jusqu'à 5MB</p>
              </div>

              <!-- Prévisualisation si fichier sélectionné -->
              <div *ngIf="selectedFileName" class="mt-2 px-3 py-1 rounded-full flex items-center gap-2 animate-fade-in"
                [ngStyle]="{ 
                      'background-color': themeService.accentSoft,
                      'color': themeService.Textprincipal
                    }">
                <i class="fa-solid fa-check-circle" [ngStyle]="{ 'color': themeService.primary }"></i>
                <span class="text-xs">{{ selectedFileName }}</span>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- ACTIONS -->
      <div class="flex gap-4 mt-8 min-[781px]:col-span-2 pt-4"
        [ngStyle]="{ 'border-top': '1px solid ' + themeService.Textsecondaire + '20' }">

        <button type="button" (click)="toggleForm()"
          class="flex-1 p-4 rounded-xl font-semibold transition-all duration-300 hover:shadow-lg active:scale-95 border flex items-center justify-center gap-2"
          [ngStyle]="{ 
                'background-color': themeService.secondary,
                'color': themeService.Textprincipal,
                'border-color': themeService.Textsecondaire + '30'
              }" onmouseover="this.style.backgroundColor='${themeService.secondaryHover}'"
          onmouseout="this.style.backgroundColor='${themeService.secondary}'">
          <i class="fa-solid fa-xmark" [ngStyle]="{ 'color': themeService.Textsecondaire }"></i>
          <span>Annuler</span>
        </button>

        <button type="submit"
          class="flex-[2] p-4 rounded-xl font-bold text-white transition-all duration-300 hover:shadow-xl active:scale-95 transform hover:-translate-y-0.5 flex items-center justify-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
          [ngStyle]="{ 
                'background': 'linear-gradient(135deg, ' + themeService.primary + ' 0%, ' + themeService.primaryHover + ' 100%)',
                'box-shadow': '0 8px 24px ' + themeService.primary + '40'
              }" [disabled]="equipeForm.invalid">
          <span>Créer l'équipe</span>
          <i class="fa-solid fa-arrow-right transition-transform duration-300 group-hover:translate-x-1"></i>
        </button>

      </div>

    </form>
  </div>
</div>

<!-- Styles d'animation personnalisés -->
<style>
  @keyframes modal-in {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
    }

    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .animate-modal-in {
    animation: modal-in 0.3s ease-out forwards;
  }

  @keyframes fade-in {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fade-in {
    animation: fade-in 0.3s ease-out forwards;
  }

  /* Scrollbar personnalisée pour le formulaire */
  form::-webkit-scrollbar {
    width: 6px;
  }

  form::-webkit-scrollbar-track {
    background: transparent;
    border-radius: 4px;
  }

  form::-webkit-scrollbar-thumb {
    background: var(--scrollbar-color, rgba(0, 0, 0, 0.2));
    border-radius: 4px;
  }

  form::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-color-hover, rgba(0, 0, 0, 0.3));
  }

  /* Focus visible pour accessibilité */
  input:focus-visible {
    outline: none;
    ring: 2px;
    ring-offset: 2px;
  }

  /* Hover states améliorés */
  .group:hover input {
    border-color: var(--input-hover-border, rgba(0, 0, 0, 0.3));
  }
</style>
