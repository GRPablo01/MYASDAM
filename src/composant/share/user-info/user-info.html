<!-- USER PROFILE -->
<div *ngIf="user" class="h-150vh pt-3 pb-3 flex items-center justify-center px-4" [ngStyle]="{
        background: themeService.Backgroundcards,
        color: themeService.Textprincipal
     }">

    <div class="w-full max-w-6xl">

        <!-- BARRE INFOS -->
        <div class="flex flex-col md:flex-row gap-4 items-center justify-center">

            <!-- NOM -->
            <div class="flex items-center gap-3 p-4 rounded-xl transition-all duration-200 hover:scale-[1.02] w-full md:w-auto"
                [ngStyle]="{
          background: themeService.Backgroundcards,
          border: themeService.Borderfocus
        }">

                <div class="w-10 h-10 flex items-center justify-center rounded-lg"
                    [ngStyle]="{ background: themeService.primarySoft }">

                    <i class="fa-solid fa-user text-lg" [ngStyle]="{ color: themeService.Iconactive }"></i>

                </div>

                <div class="flex flex-col">

                    <span class="text-xs uppercase tracking-wider" [ngStyle]="{ color: themeService.Textsecondaire }">
                        Nom
                    </span>

                    <span class="font-semibold text-sm">
                        {{ user.nom }}
                    </span>

                </div>

            </div>


            <!-- PRENOM -->
            <div class="flex items-center gap-3 p-4 rounded-xl transition-all duration-200 hover:scale-[1.02] w-full md:w-auto"
                [ngStyle]="{
          background: themeService.Backgroundcards,
          border: themeService.Borderfocus
        }">

                <div class="w-10 h-10 flex items-center justify-center rounded-lg"
                    [ngStyle]="{ background: themeService.primarySoft }">

                    <i class="fa-solid fa-id-card text-lg" [ngStyle]="{ color: themeService.Iconactive }"></i>

                </div>

                <div class="flex flex-col">

                    <span class="text-xs uppercase tracking-wider" [ngStyle]="{ color: themeService.Textsecondaire }">
                        Prénom
                    </span>

                    <span class="font-semibold text-sm">
                        {{ user.prenom }}
                    </span>

                </div>

            </div>


            <!-- ROLE -->
            <div class="flex items-center gap-3 p-4 rounded-xl transition-all duration-200 hover:scale-[1.02] w-full md:w-auto"
                [ngStyle]="{
          background: themeService.Backgroundcards,
          border: themeService.Borderfocus
        }">

                <div class="w-10 h-10 flex items-center justify-center rounded-lg"
                    [ngStyle]="{ background: themeService.primarySoft }">

                    <i class="fa-solid fa-user-shield text-lg" [ngStyle]="{ color: themeService.Iconactive }"></i>

                </div>

                <div class="flex flex-col">

                    <span class="text-xs uppercase tracking-wider" [ngStyle]="{ color: themeService.Textsecondaire }">
                        Rôle
                    </span>

                    <span class="font-semibold text-sm">
                        {{ (user.role === 'Inviter' || user.role === 'user noconnecter' ? 'Inviter' : user.role) | titlecase }}
                    </span>

                </div>

            </div>


            <!-- ID -->
            <div class="flex items-center gap-3 p-4 rounded-xl transition-all duration-200 hover:scale-[1.02] w-full md:w-auto"
                [ngStyle]="{
          background: themeService.Backgroundcards,
          border: themeService.Borderfocus
        }">

                <!-- ICON -->
                <div class="w-10 h-10 flex items-center justify-center rounded-lg"
                    [ngStyle]="{ background: themeService.primarySoft }">

                    <i class="fa-solid fa-key text-lg" [ngStyle]="{ color: themeService.Iconactive }"></i>

                </div>

                <!-- TEXTE -->
                <div class="flex flex-col flex-1">

                    <span class="text-xs uppercase tracking-wider" [ngStyle]="{ color: themeService.Textsecondaire }">
                        Key
                    </span>

                    <span class="font-semibold text-sm font-mono">
                        {{ user.key }}
                    </span>

                </div>

                <!-- COPY -->
                <button (click)="copyToClipboard(user.key)"
                    class="p-2 rounded-md transition-all duration-200 hover:scale-110 relative overflow-hidden"
                    [ngStyle]="{ background: themeService.Fondboutonsecondaire }">

                    <i class="fa-solid transition-all duration-300" [class.fa-copy]="!isCopied"
                        [class.fa-check]="isCopied"
                        [ngStyle]="{ color: isCopied ? '#22c55e' : themeService.Iconnormal }">
                    </i>

                </button>

                <!-- QR -->
                <button (click)="openQR()" class="p-2 rounded-md transition-all duration-200 hover:scale-110"
                    [ngStyle]="{ background: themeService.Fondboutonsecondaire }">

                    <i class="fa-solid fa-qrcode" [ngStyle]="{ color: themeService.Iconnormal }"></i>

                </button>

            </div>

        </div>
    </div>


    <!-- POPUP QR CODE -->
<div *ngIf="showQR" class="fixed inset-0 flex items-center justify-center bg-black/60 z-50">

    <div
      class="p-6 rounded-2xl shadow-xl flex flex-col items-center gap-4"
      [ngStyle]="{ background: themeService.Backgroundcards }"
    >
  
      <h3 class="text-lg font-semibold">
        QR Code utilisateur
      </h3>
  
      <!-- QR CONTAINER -->
      <div class="relative flex items-center justify-center w-[220px] h-[220px]">
  
        <!-- QR CODE -->
        <qrcode
        [qrdata]="'http://192.168.0.20:4200/QRCode/' + user?.key"
        [width]="220"
        [errorCorrectionLevel]="'H'"
        [colorDark]="themeService.Textprincipal"
        [colorLight]="themeService.Backgroundcards"
        >
        </qrcode>
  
        <!-- ZONE VIDE POUR LE LOGO -->
        <div
          class="absolute w-12 h-12 rounded-2xl flex items-center justify-center z-10"
          [ngStyle]="{ background: themeService.Backgroundcards }"
        >
  
          <!-- LOGO -->
            <img
            src="assets/LOGO.png"
            class="w-16 h-16 object-contain"
            style="filter: grayscale(100%) contrast(200%);"
            />
  
        </div>
  
      </div>
  
      <span class="text-xs opacity-70">
        Scanner pour accéder au profil
      </span>
  
      <button
        (click)="showQR = false"
        class="px-4 py-2 rounded-lg text-sm"
        [ngStyle]="{ background: themeService.Fondboutonsecondaire }"
      >
        Fermer
      </button>
  
    </div>
  
  </div>

</div>


<!-- LOADING -->
<div *ngIf="!user" class="min-h-screen flex items-center justify-center"
    [ngStyle]="{ background: themeService.Backgroundprincipal }">

    <div class="w-10 h-10 border-4 rounded-full animate-spin" [ngStyle]="{
      border: '4px solid ' + themeService.primarySoft,
      borderTop: '4px solid ' + themeService.primary
    }">
    </div>

</div>
