<!-- ============================================ -->
<!-- SECTION AJOUTER EQUIPE PREMIUM UI/UX -->
<!-- DESKTOP + MOBILE SEPARÉS -->
<!-- ============================================ -->
<section class="relative w-full py-5 px-5 sm:py-10 sm:px-10 overflow-hidden">

  <!-- ===================================================== -->
  <!-- DESKTOP / LAPTOP -->
  <!-- ===================================================== -->
  <div class="relative z-10 hidden lg:flex justify-center">

    <section
      class="relative w-80 h-96 rounded-2xl overflow-hidden cursor-pointer transition-all duration-500 hover:scale-105">
      <!-- IMAGE -->
      <img src="assets/ImageNew.png"
        class="absolute inset-0 w-full h-full object-cover transition-transform duration-700" />

      <!-- ICON -->
      <div [ngStyle]="{
        'background': themeService.GlassBackground,
        'border': '2px solid ' + themeService.GlassBorder,
        'backdrop-filter': 'blur(22px) saturate(180%)',
        '-webkit-backdrop-filter': 'blur(22px) saturate(180%)',
        'box-shadow': '0 10px 30px rgba(0,0,0,0.08)',
        'color':themeService.Textprincipal
      }" class="absolute top-4 right-4 w-10 h-10 flex items-center justify-center rounded-full ">
        <i [ngStyle]="{'color':themeService.primary}" class="fa-regular fa-futbol"></i>
      </div>

      <!-- TEXT CENTER -->
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="rounded-xl px-5 py-4 text-center max-w-[80%] backdrop-blur-md" [ngStyle]="{
            'background': themeService.GlassBackground,
            'border': '2px solid ' + themeService.GlassBorder,
            'color': themeService.Textprincipal
          }">
          <h3 class="text-lg font-bold mb-1">Créer une actus</h3>
          <p class="text-sm"> Créer facilement une actualité pour le club</p>
        </div>
      </div>

      <!-- BUTTON -->
      <div (click)="toggleForm()" class="absolute bottom-4 left-1/2 -translate-x-1/2 w-[85%]">
        <button
          class="w-full px-5 py-3 rounded-2xl font-medium flex items-center justify-center transition-all hover:scale-105"
          [ngStyle]="{
            'background': themeService.primary,
            'color': '#fff'
          }">
          <i class="fa-solid fa-plus mr-2"></i>
          Nouveau actus
        </button>
      </div>

    </section>

  </div>

  <!-- ===================================================== -->
  <!-- MOBILE / TABLET (VERSION HORIZONTALE) -->
  <!-- ===================================================== -->
  <div class="relative z-10 flex lg:hidden">

    <section [ngStyle]="{
      'background': themeService.GlassBackground,
      'border': '2px solid ' + themeService.GlassBorder,
      'backdrop-filter': 'blur(22px) saturate(180%)',
      '-webkit-backdrop-filter': 'blur(22px) saturate(180%)',
      'box-shadow': '0 10px 30px rgba(0,0,0,0.08)',
      'color':themeService.Textprincipal
    }" class="relative w-full h-40 rounded-2xl overflow-hidden shadow-xl flex items-center gap-4 p-3">

      <!-- IMAGE -->
      <div class="w-32 h-full rounded-xl overflow-hidden flex-shrink-0">
        <img src="assets/ImageMatch.png" class="w-full h-full object-cover" />
      </div>

      <!-- CONTENT -->
      <div class="flex-1">

        <h3 class="text-base font-bold" [ngStyle]="{
          'color': themeService.Textprincipal
        }">
          Créer une actus
        </h3>

        <p class="text-xs mt-1" [ngStyle]="{
          'color': themeService.Textsecondaire
        }">
          Créer facilement une actualité pour le club
        </p>

        <!-- BUTTON -->
        <button (click)="toggleForm()" class="mt-3 w-full py-2 rounded-xl text-sm font-medium" [ngStyle]="{
            'background': themeService.primary,
            'color': '#fff'
          }">
          <i class="fa-solid fa-plus mr-2"></i>
          Nouveau actus
        </button>

      </div>

      <!-- ICON -->
      <div
        class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center rounded-full bg-black/40 text-white text-sm">
        <i class="fa-solid fa-user-plus"></i>
      </div>

    </section>

  </div>

</section>


<!-- ============================================
     MODAL CRÉATION ACTUS - PREMIUM STEP UI/UX
     ============================================ -->
<div *ngIf="showForm"
  class="fixed inset-0 z-[2147483632] bg-black/55 flex items-center justify-center p-3 sm:p-6 overflow-y-auto"
  (click)="toggleForm()">

  <!-- MODAL -->
  <div (click)="$event.stopPropagation()"
    class="relative w-full max-h-[95vh] overflow-hidden rounded-3xl flex flex-col xl:max-w-5xl animate-modal-in shadow-2xl border"
    [ngStyle]="{
         'background': themeService.Backgroundcards,
         'border-color': themeService.primary + '20'
       }">

    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->
    <div class="flex items-center justify-between px-4 sm:px-8 py-5 border-b flex-shrink-0"
      [ngStyle]="{ 'border-color': themeService.Textsecondaire + '15' }">

      <div class="flex items-center gap-3">

        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center text-white shadow-lg"
          [ngStyle]="{
               'background': 'linear-gradient(135deg,' + themeService.primary + ', ' + themeService.primaryHover + ')'
             }">
          <i class="fa-solid fa-newspaper"></i>
        </div>

        <div>
          <h2 class="font-black text-lg sm:text-xl" [ngStyle]="{ 'color': themeService.Textprincipal }">
            Nouvelle Actualité
          </h2>
          <p class="text-xs sm:text-sm" [ngStyle]="{ 'color': themeService.Textsecondaire }">
            Création en plusieurs étapes
          </p>
        </div>

      </div>

      <button (click)="toggleForm()"
        class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center transition-all hover:scale-110 active:scale-95"
        [ngStyle]="{
             'background': themeService.Backgroundcards1,
             'border': '1px solid ' + themeService.Textsecondaire + '20'
           }">
        <i class="fa-solid fa-xmark" [ngStyle]="{ 'color': themeService.Textsecondaire }"></i>
      </button>

    </div>

    <!-- ===================================================== -->
    <!-- FORM -->
    <!-- ===================================================== -->
    <form [formGroup]="actusForm" (ngSubmit)="ajouterActus()"
      class="flex-1 overflow-y-auto p-4 sm:p-8 grid grid-cols-1 xl:grid-cols-2 gap-8">

      <!-- ===================================================== -->
      <!-- LEFT SIDE -->
      <!-- ===================================================== -->
      <div class="space-y-6">

        <!-- SECTION HEADER -->
        <div class="flex items-center gap-3 pb-4 border-b"
          [ngStyle]="{ 'border-color': themeService.Textsecondaire + '15' }">

          <div class="w-9 h-9 rounded-lg flex items-center justify-center" [ngStyle]="{
                 'background': themeService.BgNon + '40',
                 'border': '1px solid ' + themeService.BorderNon + '50'
               }">
            <i class="fa-solid fa-pen-nib text-xs" [ngStyle]="{ 'color': themeService.primary }"></i>
          </div>

          <div>
            <h3 class="font-bold text-sm uppercase tracking-wider" [ngStyle]="{ 'color': themeService.Textprincipal }">
              Contenu
            </h3>
            <p class="text-[11px]" [ngStyle]="{ 'color': themeService.Textsecondaire }">
              Titre, saison et description
            </p>
          </div>
        </div>

        <!-- TITRE -->
        <div class="group space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider flex items-center gap-2"
            [ngStyle]="{ 'color': themeService.Textsecondaire }">
            <i class="fa-solid fa-newspaper" [ngStyle]="{ 'color': themeService.primary }"></i>
            Titre
          </label>

          <input type="text" formControlName="titre" placeholder="Ex: Victoire 3-0 contre Paris..."
            class="w-full p-4 rounded-xl outline-none transition-all duration-300 focus:ring-2" [ngStyle]="{
                 'background': themeService.Backgroundcards1,
                 'color': themeService.Textprincipal,
                 'border': '1px solid ' + themeService.Textsecondaire + '20'
               }">
        </div>

        <!-- SAISON -->
        <div class="group space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider flex items-center gap-2"
            [ngStyle]="{ 'color': themeService.Textsecondaire }">
            <i class="fa-solid fa-calendar-days" [ngStyle]="{ 'color': themeService.primary }"></i>
            Saison
          </label>

          <input type="text" formControlName="saison" placeholder="2025-2026"
            class="w-full p-4 rounded-xl outline-none transition-all duration-300 focus:ring-2" [ngStyle]="{
                 'background': themeService.Backgroundcards1,
                 'color': themeService.Textprincipal,
                 'border': '1px solid ' + themeService.Textsecondaire + '20'
               }">
        </div>

        <!-- DESCRIPTION -->
        <div class="group space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider flex items-center gap-2"
            [ngStyle]="{ 'color': themeService.Textsecondaire }">
            <i class="fa-solid fa-align-left" [ngStyle]="{ 'color': themeService.primary }"></i>
            Description
          </label>

          <textarea formControlName="description" rows="5" placeholder="Décrivez votre actualité..."
            class="w-full p-4 rounded-xl outline-none resize-none transition-all duration-300 focus:ring-2" [ngStyle]="{
                 'background': themeService.Backgroundcards1,
                 'color': themeService.Textprincipal,
                 'border': '1px solid ' + themeService.Textsecondaire + '20'
               }">
             </textarea>
        </div>

      </div>

      <!-- ===================================================== -->
      <!-- RIGHT SIDE -->
      <!-- ===================================================== -->
      <div class="space-y-6">

        <!-- SECTION MEDIA -->
        <div class="flex items-center gap-3 pb-4 border-b"
          [ngStyle]="{ 'border-color': themeService.Textsecondaire + '15' }">

          <div class="w-9 h-9 rounded-lg flex items-center justify-center" [ngStyle]="{
                 'background': themeService.BgNon + '40',
                 'border': '1px solid ' + themeService.BorderNon + '50'
               }">
            <i class="fa-solid fa-image text-xs" [ngStyle]="{ 'color': themeService.primary }"></i>
          </div>

          <div>
            <h3 class="font-bold text-sm uppercase tracking-wider" [ngStyle]="{ 'color': themeService.Textprincipal }">
              Média
            </h3>
            <p class="text-[11px]" [ngStyle]="{ 'color': themeService.Textsecondaire }">
              Image de couverture
            </p>
          </div>
        </div>

        <!-- UPLOAD -->
        <label class="block group cursor-pointer">

          <input type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" />

          <div class="p-6 rounded-2xl border-2 border-dashed text-center transition-all hover:scale-[1.01]" [ngStyle]="{
                 'background': themeService.Backgroundcards1,
                 'border-color': themeService.Textsecondaire + '30'
               }">

            <i class="fa-solid fa-cloud-arrow-up text-3xl mb-3" [ngStyle]="{ 'color': themeService.primary }"></i>

            <p class="text-sm font-semibold" [ngStyle]="{ 'color': themeService.Textprincipal }">
              Cliquez ou déposez une image
            </p>

            <p class="text-xs mt-1" [ngStyle]="{ 'color': themeService.Textsecondaire }">
              JPG, PNG jusqu’à 5MB
            </p>

          </div>
        </label>

        <!-- PREVIEW -->
        <div *ngIf="imagePreview" class="relative rounded-2xl overflow-hidden border"
          [ngStyle]="{ 'border-color': themeService.primary + '30' }">

          <img [src]="imagePreview" class="w-full h-48 object-cover" />

          <button type="button" (click)="imagePreview = null"
            class="absolute top-2 right-2 w-8 h-8 rounded-full flex items-center justify-center bg-black/50 text-white">
            <i class="fa-solid fa-xmark"></i>
          </button>

        </div>

      </div>

      <!-- ===================================================== -->
      <!-- ACTIONS -->
      <!-- ===================================================== -->
      <div class="xl:col-span-2 flex flex-col sm:flex-row gap-3 pt-4 border-t"
        [ngStyle]="{ 'border-color': themeService.Textsecondaire + '15' }">

        <button type="button" (click)="toggleForm()" class="flex-1 p-4 rounded-xl font-bold transition-all" [ngStyle]="{
               'background': themeService.Backgroundcards1,
               'color': themeService.Textprincipal,
               'border': '1px solid ' + themeService.Textsecondaire + '20'
             }">
          Annuler
        </button>

        <button type="submit" class="flex-[2] p-4 rounded-xl font-bold text-white transition-all hover:scale-[1.01]"
          [ngStyle]="{
               'background': 'linear-gradient(135deg,' + themeService.primary + ',' + themeService.primaryHover + ')'
             }" [disabled]="!actusForm.valid">

          Publier l’actualité
        </button>

      </div>

    </form>
  </div>
</div>


<!-- ============================= -->
<!-- TOAST NOTIFICATION -->
<!-- ============================= -->
<div
  *ngIf="showNotification"
  class="fixed top-20 right-4 z-[12000] animate-slide-from-right">

  <div class="relative flex items-center gap-3 px-5 py-4 rounded-xl shadow-2xl
              backdrop-blur-md bg-emerald-500/95 border border-emerald-400/30
              min-w-[300px] max-w-[400px] overflow-hidden">

    <!-- ICON -->
    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
      <i class="fa-solid fa-circle-check text-white text-xl animate-icon-pop"></i>
    </div>

    <!-- TEXT -->
    <div class="flex-1 min-w-0">
      <p class="text-white font-semibold text-sm">Succès</p>
      <p class="text-white/90 text-sm truncate">
        {{ notificationMessage }}
      </p>
    </div>

    <!-- CLOSE -->
    <button 
      (click)="closeNotification()"
      class="flex-shrink-0 w-7 h-7 rounded-full hover:bg-white/20
             flex items-center justify-center transition group focus:outline-none">
      <i class="fa-solid fa-xmark text-white/70 group-hover:text-white text-sm"></i>
    </button>
  </div>
</div>

<!-- Styles d'animation personnalisés -->
<style>
  @keyframes modal-in {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
    }

    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .animate-modal-in {
    animation: modal-in 0.3s ease-out forwards;
  }

  @keyframes fade-in {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fade-in {
    animation: fade-in 0.3s ease-out forwards;
  }

  /* Scrollbar personnalisée pour le formulaire */
  form::-webkit-scrollbar {
    width: 6px;
  }

  form::-webkit-scrollbar-track {
    background: transparent;
    border-radius: 4px;
  }

  form::-webkit-scrollbar-thumb {
    background: var(--scrollbar-color, rgba(0, 0, 0, 0.2));
    border-radius: 4px;
  }

  form::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-color-hover, rgba(0, 0, 0, 0.3));
  }

  /* Focus visible pour accessibilité */
  input:focus-visible {
    outline: none;
    ring: 2px;
    ring-offset: 2px;
  }

  /* Hover states améliorés */
  .group:hover input {
    border-color: var(--input-hover-border, rgba(0, 0, 0, 0.3));
  }
</style>
