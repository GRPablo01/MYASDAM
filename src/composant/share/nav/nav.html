<!-- ================= NAVIGATION RESPONSIVE ================= -->

<!-- ================= DESKTOP ================= -->
<nav class="hidden custom-desktop:flex justify-end px-6 py-4">
  <ul class="flex space-x-6 md:space-x-4 sm:space-x-2">
    <li *ngFor="let link of navLinks; let i = index">
      <a
        #rla="routerLinkActive"
        [routerLink]="link.path"
        routerLinkActive="font-bold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-3 py-2 rounded-lg transition-all duration-300 flex items-center gap-2"
        [ngStyle]="getLinkStyle(rla.isActive, i)"
        (mouseenter)="hoverIndex = i"
        (mouseleave)="hoverIndex = -1"
      >
        <!-- ICON -->
        <i [class]="link.icon"></i>

        <!-- TEXTE -->
        {{ link.label }}
      </a>
    </li>
  </ul>
</nav>
<!-- ================= TABLETTE + MOBILE ================= -->
<nav
  class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-sm custom-desktop:hidden custom-tablet:block"
>
  <div
    class="backdrop-blur-xl rounded-full shadow-2xl px-2 py-2"
    [ngStyle]="{
      background: themeService.Backgroundcards,
      border: themeService.Bordernormal
    }"
  >
    <ul class="flex items-center justify-between">
      <li class="flex-1" *ngFor="let link of navLinks; let i = index">
        <a
          #rla="routerLinkActive"
          [routerLink]="link.path"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="shadow-lg scale-110"
          class="group flex flex-col items-center justify-center gap-1 px-2 py-2 rounded-full transition-all duration-300 w-full"
          [ngStyle]="{
            background: rla.isActive ? themeService.primary : 'transparent',
            color: rla.isActive ? '#FFF' : themeService.Iconnormal
          }"
        >
          <div
            class="w-6 h-6 flex items-center justify-center transition-transform duration-300 group-hover:scale-110"
          >
            <i
              [class]="link.icon"
              [ngStyle]="{
                color: rla.isActive ? '#FFF' : themeService.Iconnormal
              }"
              class="text-lg"
            ></i>
          </div>
          <span
            class="text-[10px] font-semibold leading-none transition-all duration-300 max-[380px]:opacity-0 max-[380px]:h-0"
          >
            {{ link.label }}
          </span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<!-- Pour éviter que le contenu soit caché derrière la nav mobile -->
<div class="h-20 md:hidden"></div>

<!-- ================= CUSTOM BREAKPOINTS ================= -->
<style>
  /* Desktop ≥ 1120px */
  @media (min-width: 1120px) {
    .custom-desktop\:block { display: block !important; }
    .custom-desktop\:flex { display: flex !important; }
    .custom-desktop\:hidden { display: none !important; }
  }

  /* Tablette + Mobile 383px à 1119px */
  @media (min-width: 383px) and (max-width: 1119px) {
    .custom-tablet\:block { display: block !important; }
    .custom-tablet\:hidden { display: none !important; }
  }

  /* Petit mobile < 383px (toujours visible si besoin) */
  @media (max-width: 382px) {
    .custom-tablet\:block { display: block !important; }
  }
</style>
