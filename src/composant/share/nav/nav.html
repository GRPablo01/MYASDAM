<!-- nav.component.html -->
<nav class="sticky top-0 z-10 transition-all duration-300 ml-2 hidden min-[1119px]:flex">
    <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
  
      <!-- MENU PRINCIPAL -->
      <ul class="flex gap-1 items-center">
  
        <li *ngFor="let item of menu; let i = index" class="relative">
  
          <!-- Lien principal -->
          <a
            [routerLink]="item.link || '#'"
            (click)="item.children ? toggleMenu(i) : null"
            class="flex items-center gap-2 cursor-pointer select-none px-4 py-2.5 rounded-xl transition-all duration-200 relative overflow-hidden group"
            [ngClass]="{
              'bg-opacity-20': openMenuIndex === i,
              'scale-105': openMenuIndex === i
            }"
            [ngStyle]="{
              'color': openMenuIndex === i ? themeService.primary : (hoveredIndex === i ? themeService.primary : themeService.Textprincipal),
              'background-color': openMenuIndex === i ? themeService.secondarySoft : 'transparent'
            }"
            (mouseenter)="hoveredIndex = i; item.children ? openMenuIndex = i : null"
            (mouseleave)="hoveredIndex = -1; !item.children ? null : null"
          >
            <!-- Effet de ripple/hover -->
            <span class="absolute inset-0 rounded-xl opacity-0 group-hover:opacity-10 transition-opacity duration-300"
                  [ngStyle]="{'background-color': themeService.primary}"></span>
  
            <i *ngIf="item.icon" 
               [class]="item.icon + ' text-md transition-transform duration-200 group-hover:scale-110'" 
               [ngStyle]="{'color': hoveredIndex === i || openMenuIndex === i ? themeService.primary : themeService.Iconnormal}">
            </i>
            
            <span class="font-medium text-lg">{{ item.label }}</span> <!-- texte principal plus grand -->
  
            <!-- Badge (optionnel) -->
            <span *ngIf="item.badge" 
                  class="ml-1 px-1.5 py-0.5 text-[10px] font-bold rounded-full text-white animate-pulse"
                  [ngStyle]="{'background-color': themeService.accent}">
              {{ item.badge }}
            </span>
  
            <!-- Flèche animée -->
            <i
              *ngIf="item.children"
              class="fas fa-chevron-down ml-1 text-xs transition-all duration-300"
              [class.rotate-180]="openMenuIndex === i"
              [class.translate-y-0.5]="openMenuIndex === i"
              [ngStyle]="{'color': hoveredIndex === i || openMenuIndex === i ? themeService.primary : themeService.Iconnormal}"
            ></i>
          </a>
  
          <!-- Sous-menu amélioré avec animation -->
          <div
            *ngIf="item.children?.length"
            class="absolute left-0 top-full mt-2 w-56 rounded-2xl overflow-hidden shadow-2xl border transition-all duration-300 origin-top-left"
            [ngClass]="{
              'opacity-100 scale-100 translate-y-0': openMenuIndex === i,
              'opacity-0 scale-95 -translate-y-2 pointer-events-none': openMenuIndex !== i
            }"
            [ngStyle]="{
              'background-color': themeService.Backgroundcards,
              'border-color': themeService.Border + '30',
              'box-shadow': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)'
            }"
            (mouseenter)="openMenuIndex = i"
            (mouseleave)="openMenuIndex = -1"
          >
            <!-- Header du sous-menu -->
            <div class="px-4 py-3 border-b border-opacity-20" [ngStyle]="{'border-color': themeService.Border}">
              <span class="text-xs font-semibold uppercase tracking-wider opacity-60" [ngStyle]="{'color': themeService.Textprincipal}">
                {{ item.label }}
              </span>
            </div>
  
            <ul class="py-2">
              <li *ngFor="let child of item.children; let last = last">
                <a
                  [routerLink]="child.link"
                  class="flex items-center gap-3 px-4 py-2.5 mx-2 rounded-xl transition-all duration-200 group relative"
                  [ngClass]="{
                    'mb-1': !last
                  }"
                  [ngStyle]="{
                    'color': hoveredChild === child ? '#ffffff' : themeService.Textprincipal,
                    'background-color': hoveredChild === child ? themeService.primary : 'transparent',
                    'transform': hoveredChild === child ? 'translateX(4px)' : 'translateX(0)'
                  }"
                  (mouseenter)="hoveredChild = child"
                  (mouseleave)="hoveredChild = null"
                >
                  <!-- Indicateur actif -->
                  <span *ngIf="child.active" 
                        class="absolute left-0 w-1 h-6 rounded-full transition-all duration-200"
                        [ngStyle]="{'background-color': hoveredChild === child ? '#ffffff' : themeService.primary}">
                  </span>
  
                  <div class="w-8 h-8 rounded-lg flex items-center justify-center transition-colors duration-200"
                       [ngStyle]="{
                         'background-color': hoveredChild === child ? 'rgba(255,255,255,0.2)' : themeService.primarySoft,
                         'color': hoveredChild === child ? '#ffffff' : themeService.primary
                       }">
                    <i *ngIf="child.icon" [class]="child.icon + ' text-sm'"></i>
                    <i *ngIf="!child.icon" class="fas fa-arrow-right text-xs"></i>
                  </div>
  
                  <div class="flex flex-col">
                    <span class="font-medium text-sm">{{ child.label }}</span>
                    <span *ngIf="child.description" 
                          class="text-xs opacity-70 transition-opacity"
                          [ngStyle]="{'color': hoveredChild === child ? 'rgba(255,255,255,0.8)' : themeService.Textsecondaire}">
                      {{ child.description }}
                    </span>
                  </div>
  
                  <!-- Shortcut key -->
                  <span *ngIf="child.shortcut" 
                        class="ml-auto text-[10px] px-1.5 py-0.5 rounded border opacity-50"
                        [ngStyle]="{
                          'border-color': hoveredChild === child ? 'rgba(255,255,255,0.3)' : themeService.Border,
                          'color': hoveredChild === child ? 'rgba(255,255,255,0.8)' : themeService.Textsecondaire
                        }">
                    {{ child.shortcut }}
                  </span>
                </a>
              </li>
            </ul>
  
            <!-- Footer du sous-menu -->
            <div *ngIf="item.footer" 
                 class="px-4 py-3 border-t border-opacity-20 bg-opacity-50"
                 [ngStyle]="{'border-color': themeService.Border, 'background-color': themeService.primarySoft}">
              <a [routerLink]="item.footer.link" 
                 class="flex items-center gap-2 text-xs font-medium transition-colors"
                 [ngStyle]="{'color': themeService.primary}">
                <span>{{ item.footer.label }}</span>
                <i class="fas fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
              </a>
            </div>
          </div>
  
        </li>
  
      </ul>
  
    </div>
</nav>
