<button
  type="button"
  (mouseenter)="hoverNotif = true"
  (mouseleave)="hoverNotif = false"
  class="w-12 h-12 rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all duration-300"
  aria-label="Notifications"
>
  <i
    class="fa-solid fa-bell text-xl transition-all duration-500"
    [ngStyle]="{ 'color': hoverNotif ? themeService.primary : themeService.Iconnormal }"
  ></i>
</button>
