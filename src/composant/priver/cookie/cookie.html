<!-- ============================= -->
<!-- OVERLAY -->
<!-- ============================= -->
<div
  *ngIf="show"
  class="fixed inset-0 z-[2147483648] bg-black/60 backdrop-blur-sm animate-fade-in"
  aria-hidden="true">
</div>

<!-- ============================= -->
<!-- COOKIE BANNER -->
<!-- ============================= -->
<div
  *ngIf="show"
  role="dialog"
  aria-modal="true"
  aria-labelledby="cookie-title"
  aria-describedby="cookie-desc"
  class="fixed bottom-0 left-0 right-0 z-[2147483649] px-4 pb-4 animate-slide-up">

  <div
  [ngStyle]="{
    'background': themeService.GlassBackground,
    'border': '2px solid ' + themeService.GlassBorder,
    'backdrop-filter': 'blur(22px) saturate(180%)',
    '-webkit-backdrop-filter': 'blur(22px) saturate(180%)',
    'box-shadow': '0 10px 30px rgba(0,0,0,0.08)',
    'color':themeService.Textprincipal
  }"
    class="w-full max-w-4xl mx-auto rounded-2xl shadow-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-6 transition-all duration-300">

    <!-- LEFT CONTENT -->
    <div class="flex items-start gap-4 flex-1">

      <!-- LOGO -->
      <img
        src="assets/LOGO.png"
        alt="Logo application"
        class="w-12 h-12 flex-shrink-0 drop-shadow-lg hover:scale-110 transition-transform duration-300"
        loading="lazy"/>

      <!-- TEXT -->
      <div class="text-sm leading-relaxed">
        <p id="cookie-title" class="font-semibold text-base mb-1">
          Gestion des cookies
        </p>

        <p id="cookie-desc" class="opacity-90">
          Nous utilisons des cookies pour améliorer votre expérience :
          navigation fluide, sécurisée et personnalisée.
        </p>

        <a
          href="/cookies"
          class="inline-block mt-2 underline transition-all duration-300 hover:opacity-80 hover:translate-x-1 focus:outline-none focus:ring-2 rounded">
          En savoir plus →
        </a>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="flex gap-3 shrink-0 flex-wrap sm:flex-nowrap">

      <!-- ACCEPT -->
      <button
        (click)="accept()"
        [ngStyle]="{'background': themeService.primary}"
        class="px-5 py-2.5 rounded-full font-semibold text-white
               transition-all duration-300 transform
               hover:scale-105 hover:shadow-lg
               active:scale-95 focus:outline-none focus:ring-2">
        Accepter
      </button>

      <!-- REFUSE -->
      <button
        (click)="refuse()"
        [ngStyle]="{
          'border': '1px solid ' + themeService.Borderfocus,
          'color': themeService.Textsecondaire
        }"
        class="px-5 py-2.5 rounded-full font-semibold border
               transition-all duration-300 transform
               hover:bg-gray-100/20 hover:border-gray-400
               active:scale-95 focus:outline-none focus:ring-2">
        Refuser
      </button>

    </div>
  </div>
</div>

<!-- ============================= -->
<!-- TOAST NOTIFICATION -->
<!-- ============================= -->
<div
  *ngIf="showNotification"
  class="fixed top-20 right-4 z-[12000] animate-slide-from-right">

  <div class="relative flex items-center gap-3 px-5 py-4 rounded-xl shadow-2xl
              backdrop-blur-md bg-emerald-500/95 border border-emerald-400/30
              min-w-[300px] max-w-[400px] overflow-hidden">

    <!-- ICON -->
    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
      <i class="fa-solid fa-circle-check text-white text-xl animate-icon-pop"></i>
    </div>

    <!-- TEXT -->
    <div class="flex-1 min-w-0">
      <p class="text-white font-semibold text-sm">Succès</p>
      <p class="text-white/90 text-sm truncate">
        {{ notificationMessage }}
      </p>
    </div>

    <!-- CLOSE -->
    <button 
      (click)="closeNotification()"
      class="flex-shrink-0 w-7 h-7 rounded-full hover:bg-white/20
             flex items-center justify-center transition group focus:outline-none">
      <i class="fa-solid fa-xmark text-white/70 group-hover:text-white text-sm"></i>
    </button>
  </div>
</div>

<!-- ============================= -->
<!-- ANIMATIONS -->
<!-- ============================= -->
<style>
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slide-up {
  from { opacity: 0; transform: translateY(100%); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slide-from-right {
  0% {
    opacity: 0;
    transform: translateX(100%) scale(0.9);
  }
  70% {
    transform: translateX(-5%) scale(1.02);
  }
  100% {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}

/* ICON POP */
@keyframes icon-pop {
  0% { transform: scale(0) rotate(-180deg); }
  60% { transform: scale(1.2) rotate(10deg); }
  100% { transform: scale(1) rotate(0); }
}

/* CLASSES */
.animate-fade-in {
  animation: fade-in 0.4s ease-out forwards;
}

.animate-slide-up {
  animation: slide-up 0.5s ease-out forwards;
}

.animate-slide-from-right {
  animation: slide-from-right 0.5s ease-out forwards;
}

.animate-icon-pop {
  animation: icon-pop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}
</style>
