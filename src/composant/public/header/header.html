<app-icon></app-icon>

<header
  class="fixed top-0 z-[2147483630] h-16 w-full flex items-center justify-between px-3 sm:px-5"
  [ngStyle]="{
    'background': themeService.Backgroundprincipal,
    'color': themeService.Textprincipal,
    'border-bottom': '1px solid' + themeService.Bordernormal
  }"
>

  <!-- ===================== -->
  <!-- BLOC GAUCHE -->
  <!-- ===================== -->
  <div class="flex items-center">

    <!-- LOGO -->
    <div class="flex items-center">
      <app-logo></app-logo>
    </div>

    <!-- séparateur -->
    <div
      class="hidden min-[1243px]:block h-6 w-px opacity-30 mx-3"
      [ngStyle]="{'background': themeService.Textprincipal}"
    ></div>

    <!-- NAVIGATION (rapprochée) -->
    <div class="items-center -ml-5">
      <app-nav></app-nav>
      
    </div>

  </div>

  <!-- ===================== -->
  <!-- BLOC DROITE -->
  <!-- ===================== -->
  <div class="flex items-center gap-3">

    <!-- séparateur -->
    <div
      class="hidden min-[1243px]:block h-6 w-px opacity-30"
      [ngStyle]="{'background': themeService.Textprincipal}"
    ></div>

    <!-- ICONS -->
    <div class="flex items-center">
      <app-icon2></app-icon2>
    </div>

    <!-- PROFIL -->
    <div class="flex items-center">
      <app-profil></app-profil>
    </div>

  </div>

</header>
