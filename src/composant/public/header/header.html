<app-icon></app-icon>

<!-- HEADER -->
<header class="flex items-center justify-between h-16 px-4" [ngStyle]="{
  'background': themeService.Backgroundprincipal,
  'color': themeService.Textprincipal,
  'border-bottom': themeService.Bordernormal
}" >

  <!-- ===================== -->
  <!-- BLOC GAUCHE -->
  <!-- ===================== -->
  <div class="flex items-center gap-3 min-w-0 -ml-3">
    <app-logo class="flex-shrink-0"></app-logo>

    <app-icon2 class="flex-shrink-0 sm:block max-[525px]:hidden"></app-icon2>
  </div>

  <!-- ===================== -->
  <!-- BLOC DROIT -->
  <!-- ===================== -->
  <div class="flex items-center gap-3 min-w-0">

    <!-- NAV -->
    <div class="hidden sm:flex items-center">
      <app-nav></app-nav>
    </div>

    <!-- PROFIL -->
    <app-profil class="flex-shrink-0"></app-profil>

  </div>

</header>
