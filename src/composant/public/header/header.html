<app-icon></app-icon>


<header class="fixed top-0 flex items-center justify-between z-[2147483647] h-16 pl-2 pr-4 w-full" 
  [ngStyle]="{
    'background': themeService.Backgroundprincipal,
    'color': themeService.Textprincipal,
    'border-bottom': themeService.Bordernormal
  }">

  <app-logo></app-logo>
  <!-- séparateur -->
  <div [ngStyle]="{'background':themeService.Textprincipal}" class="hidden sm:block h-6 w-px opacity-30 bg-current"></div>

  <app-nav></app-nav>

  <!-- séparateur -->
  <div [ngStyle]="{'background':themeService.Textprincipal}" class="hidden sm:block h-6 w-px opacity-30 bg-current"></div>
  <app-icon2></app-icon2>
  <app-profil></app-profil>

</header>
